<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Repro - Canvas Rendering Artifact Test</title>
<link rel="stylesheet" href="../../dist/retroterm.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0e1c;
    color: #ccc;
    font-family: 'Fira Mono', monospace;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ===== TERMINAL WINDOW (same as template-glass styles.css:787) ===== */
  .terminal-window {
    position: fixed;
    top: 60px;
    left: 10px;
    width: 860px;
    height: 650px;
    zoom: calc(1 / var(--ui-zoom, 1));
    background: rgba(12, 16, 35, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5), 0 0 60px rgba(0, 130, 143, 0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: 'Fira Mono', 'SF Mono', 'Monaco', 'Consolas', monospace;
    font-size: 12px;
    user-select: none;
  }
  .terminal-window::before {
    content: '';
    position: absolute;
    inset: 0;
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-radius: inherit;
    z-index: -1;
    pointer-events: none;
  }
  .terminal-window > * {
    position: relative;
    z-index: 1;
  }
  .terminal-window.maximized {
    top: 49px !important;
    left: 0 !important;
    bottom: auto;
    width: calc(100vw * var(--ui-zoom, 1)) !important;
    height: calc((100vh - 49px) * var(--ui-zoom, 1)) !important;
    border-radius: 0;
    transform: none;
  }

  /* ===== HEADER (same as template-glass styles.css:831) ===== */
  .terminal-window-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: rgba(0, 105, 92, 0.25);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    cursor: grab;
    flex-shrink: 0;
  }
  .terminal-window-header:active { cursor: grabbing; }
  .terminal-window-title {
    font-weight: 700;
    font-size: 13px;
    color: rgba(180, 230, 225, 0.95);
    letter-spacing: 0.5px;
  }
  .terminal-window-controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .term-header-select {
    padding: 3px 6px;
    font-size: 11px;
    min-width: 100px;
    max-width: 140px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    background: rgba(15, 20, 40, 0.5);
    color: rgba(180, 200, 220, 0.8);
    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .term-header-select:hover { border-color: rgba(255, 255, 255, 0.15); }
  .term-header-select:focus { outline: none; border-color: rgba(100, 130, 255, 0.4); }
  .term-header-select option { background: #1a1e35; color: #c8d0e0; }
  .term-font-size-badge {
    font-size: 10px;
    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
    color: rgba(180, 200, 230, 0.45);
    white-space: nowrap;
    min-width: 30px;
    text-align: right;
    letter-spacing: -0.3px;
    user-select: none;
  }
  .terminal-window-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: rgba(200, 210, 230, 0.6);
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    cursor: pointer;
    padding: 0;
    min-width: 28px;
    transition: all 0.2s;
  }
  .terminal-window-btn:hover {
    background: rgba(100, 130, 255, 0.3);
    color: #fff;
  }

  /* ===== BODY (same as template-glass styles.css:869) ===== */
  .terminal-window-body {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* ===== TABS (same as template-glass styles.css:711) ===== */
  .terminal-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 0;
    background: rgba(15, 20, 40, 0.3);
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    padding: 10px 10px 0 10px;
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }
  .terminal-tab {
    position: relative;
    top: 2px;
    padding: 10px 28px 8px 28px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    margin-right: 2px;
    cursor: pointer;
    color: rgba(200, 210, 230, 0.5);
    font-weight: 500;
    transition: all 0.3s ease;
  }
  .terminal-tab.active {
    background: rgba(255, 255, 255, 0.08);
    color: #e8ecf4;
    z-index: 3;
    border-color: rgba(255, 255, 255, 0.12);
    box-shadow: 0 -2px 12px rgba(100, 130, 255, 0.08);
  }
  .terminal-tab:not(.active):hover {
    background: rgba(255, 255, 255, 0.06);
    color: rgba(200, 210, 230, 0.8);
  }

  /* ===== CONTAINER (same as template-glass styles.css:749) ===== */
  .terminal-container {
    background: transparent;
    border-top: none;
    display: none;
    padding: 0;
    overflow: hidden;
    position: relative;
    flex: 1;
    min-height: 0;
  }
  .terminal-container.active {
    display: flex;
    flex: 1;
  }

  /* ===== CANVAS (same as template-glass styles.css:2625) ===== */
  .terminal-container canvas.retroterm-canvas {
    display: block;
    will-change: transform;
  }

  /* ===== RESIZE HANDLE (same as template-glass styles.css:607) ===== */
  .glass-resize-handle {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 20px;
    height: 20px;
    cursor: nwse-resize;
    z-index: 10;
  }
  .glass-resize-handle::before,
  .glass-resize-handle::after {
    content: '';
    position: absolute;
    background: rgba(180, 210, 230, 0.3);
    border-radius: 1px;
  }
  .glass-resize-handle::before {
    bottom: 4px; right: 4px;
    width: 10px; height: 2px;
    transform: rotate(-45deg); transform-origin: bottom right;
  }
  .glass-resize-handle::after {
    bottom: 4px; right: 4px;
    width: 2px; height: 10px;
    transform: rotate(-45deg); transform-origin: bottom right;
  }
  .glass-resize-grip {
    position: absolute;
    bottom: 3px; right: 3px;
    width: 12px; height: 12px;
    opacity: 0.4;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .glass-resize-handle:hover .glass-resize-grip { opacity: 0.8; }

  /* ===== LOADING OVERLAY ===== */
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 14, 28, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    color: rgba(0, 200, 143, 0.7);
    font-size: 14px;
    transition: opacity 0.3s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }

  /* ===== CONTROLS ===== */
  #controls {
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(30, 40, 60, 0.9);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 12px;
    font-size: 12px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 320px;
    max-height: 95vh;
    overflow-y: auto;
  }
  #controls label { display: flex; align-items: center; gap: 8px; }
  #controls input[type=range] { flex: 1; }
  #controls button {
    padding: 6px 12px;
    background: rgba(0, 130, 143, 0.4);
    border: 1px solid rgba(0, 200, 200, 0.3);
    border-radius: 4px;
    color: #fff;
    cursor: pointer;
    font-size: 12px;
  }
  #controls button:hover { background: rgba(0, 130, 143, 0.6); }
  .status { color: #4fc; font-size: 11px; }
  .variant-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .variant-row button.active { background: rgba(0, 200, 143, 0.5); border-color: #4fc; }
  #host-input {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(0,200,200,0.3);
    border-radius: 4px;
    color: #b0ffb0;
    font-family: 'Fira Mono', monospace;
    font-size: 12px;
    padding: 4px 8px;
    flex: 1;
  }
  .section-label { color:#aaa; font-size:11px; font-weight:bold; }
  hr { border-color: rgba(255,255,255,0.1); }
</style>
</head>
<body>

<!-- Glass terminal window (same structure as template-glass index.html:532-588) -->
<div id="terminal-window" class="terminal-window">
  <div class="terminal-window-header" id="terminal-window-header">
    <span class="terminal-window-title" id="terminal-window-title">Console (TDV2200)</span>
    <div class="terminal-window-controls">
      <span class="term-font-size-badge" id="console-fontsize">bitmap</span>
      <select id="font-family-select" class="term-header-select" title="Font">
        <option value="monospace" selected>Monospace</option>
        <option value="'VT323', monospace">VT323</option>
        <option value="'Fira Mono', monospace">Fira Mono</option>
      </select>
      <select id="color-theme-select" class="term-header-select" title="Color Theme">
        <option value="green" selected>Green</option>
        <option value="amber">Amber</option>
        <option value="white">White</option>
      </select>
      <button class="terminal-window-btn" id="term-vk-toggle" title="Virtual Keyboard" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <line x1="6" y1="8" x2="6" y2="8"/><line x1="10" y1="8" x2="10" y2="8"/>
          <line x1="14" y1="8" x2="14" y2="8"/><line x1="18" y1="8" x2="18" y2="8"/>
          <line x1="8" y1="16" x2="16" y2="16"/>
        </svg>
      </button>
      <button class="terminal-window-btn" id="term-maximize" title="Maximize">
        <svg id="term-maximize-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9,1 13,1 13,5"/>
          <line x1="13" y1="1" x2="8" y2="6"/>
          <polyline points="5,13 1,13 1,9"/>
          <line x1="1" y1="13" x2="6" y2="8"/>

      </button>
    </div>

  <div class="terminal-window-body" id="terminal-window-body">

    <svg class="glass-resize-grip" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <line x1="11" y1="1" x2="1" y2="11"/><line x1="11" y1="5" x2="5" y2="11"/><line x1="11" y1="9" x2="9" y2="11"/>

</div>

<!-- Test controls -->
<div id="controls">

  <label>

  </div>

  <hr>
  <span class="section-label">CSS Toggles (live)</span>
  <div class="variant-row">
    <button id="tog-zoom" class="active">zoom counter</button>
    <button id="tog-backdrop" class="active">backdrop-filter</button>
    <button id="tog-willchange" class="active">will-change</button>
  </div>

  <div id="log" style="font-size:10px; color:#888; max-height:120px; overflow:auto; margin-top:4px"></div>
</div>

<script src="../../dist/retroterm.js"></script>
<script>
(function() {
  var RetroTerm = window.RetroTerm;
  var termWindowBody = document.getElementById('terminal-window-body');
  var tabsEl = document.getElementById('terminal-tabs');
  var statusEl = document.getElementById('status');
  var logEl = document.getElementById('log');
  var termWindow = document.getElementById('terminal-window');
  var termHeader = document.getElementById('terminal-window-header');
  var resizeHandle = document.getElementById('terminal-window-resize');

  // ===== CONFIG FLAGS (URL params) =====
  var params = new URLSearchParams(location.search);
  var CHAR_BY_CHAR = params.get('charbychar') === '1';
  var FONT_DELAY = params.get('fontdelay') === '1';
  var SHOW_OVERLAY = params.get('overlay') !== '0';
  var TWO_TABS = params.get('twotabs') === '1';

  if (CHAR_BY_CHAR) document.getElementById('tog-charbychar').classList.add('active');
  if (FONT_DELAY) document.getElementById('tog-fontdelay').classList.add('active');
  if (!SHOW_OVERLAY) document.getElementById('tog-overlay').classList.remove('active');
  if (TWO_TABS) document.getElementById('tog-twotabs').classList.add('active');

  function log(msg) {
    var d = new Date();
    var ts = d.toTimeString().split(' ')[0];
    logEl.innerHTML += '<div>' + ts + ' ' + msg + '</div>';
    logEl.scrollTop = logEl.scrollHeight;
  }

  log('char-by-char: ' + CHAR_BY_CHAR);
  log('font-delay: ' + FONT_DELAY);
  log('overlay: ' + SHOW_OVERLAY);
  log('two-tabs: ' + TWO_TABS);

  // ===== ZOOM SYSTEM (same as template-glass index.html:43-59) =====
  var currentZoom = 0.7;

  function applyZoom(z) {
    currentZoom = z;
    document.documentElement.style.zoom = z;
    document.documentElement.style.setProperty('--ui-zoom', z);
  }

  applyZoom(currentZoom);

  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      var nz = Math.max(0.5, Math.min(1, Math.min(
        window.innerWidth / 1280,
        window.innerHeight / 800
      )));
      applyZoom(nz);
      document.getElementById('zoom-slider').value = nz;
      document.getElementById('zoom-val').textContent = nz.toFixed(2);
      resizeAll();
    }, 100);
  });

  // ===== DRAGGABLE (same as template-glass toolbar.js:50-83) =====
  (function() {
    var dragging = false, ox = 0, oy = 0;

    termHeader.addEventListener('mousedown', function(e) {
      if (e.target.closest('button') || e.target.closest('select')) return;
      if (termWindow.classList.contains('maximized')) return;
      dragging = true;
      ox = e.clientX - termWindow.getBoundingClientRect().left;
      oy = e.clientY - termWindow.getBoundingClientRect().top;
      e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      termWindow.style.left = Math.max(0, Math.min(window.innerWidth - 100, e.clientX - ox)) + 'px';
      termWindow.style.top = Math.max(0, Math.min(window.innerHeight - 60, e.clientY - oy)) + 'px';
      termWindow.style.bottom = 'auto';
      termWindow.style.right = 'auto';
      termWindow.style.transform = 'none';
    });

    document.addEventListener('mouseup', function() {
      if (dragging) {
        dragging = false;
        try {
          localStorage.setItem('glass-repro-term-pos', JSON.stringify({
            left: termWindow.style.left,
            top: termWindow.style.top,
            width: termWindow.style.width,
            height: termWindow.style.height
          }));
        } catch(e) {}
      }
    });

    // Restore position
    try {
      var pos = JSON.parse(localStorage.getItem('glass-repro-term-pos'));
      if (pos) {
        if (pos.left) {
          termWindow.style.left = Math.max(0, Math.min(parseInt(pos.left) || 0, window.innerWidth - 200)) + 'px';
          termWindow.style.top = Math.max(0, Math.min(parseInt(pos.top) || 0, window.innerHeight - 100)) + 'px';
          termWindow.style.bottom = 'auto';
          termWindow.style.transform = 'none';
        }
        if (pos.width) termWindow.style.width = Math.min(parseInt(pos.width) || 860, window.innerWidth - 20) + 'px';
        if (pos.height) termWindow.style.height = pos.height;
      }
    } catch(e) {}
  })();

  // ===== RESIZABLE (same as template-glass toolbar.js:1267-1320) =====
  (function() {
    var resizing = false;
    var startX, startY, startW, startH;
    var minW = 400, minH = 300;

    resizeHandle.addEventListener('mousedown', function(e) {
      e.preventDefault();
      e.stopPropagation();
      resizing = true;
      startX = e.clientX;
      startY = e.clientY;
      startW = termWindow.offsetWidth;
      startH = termWindow.offsetHeight;
      termWindow.style.transform = 'none';
      if (!termWindow.style.left || termWindow.style.left === '') {
        var rect = termWindow.getBoundingClientRect();
        termWindow.style.left = rect.left + 'px';
        termWindow.style.top = rect.top + 'px';
      }
    });

    document.addEventListener('mousemove', function(e) {
      if (!resizing) return;
      termWindow.style.width = Math.max(minW, startW + (e.clientX - startX)) + 'px';
      termWindow.style.height = Math.max(minH, startH + (e.clientY - startY)) + 'px';
    });

    document.addEventListener('mouseup', function() {
      if (resizing) {
        resizing = false;
        try {
          localStorage.setItem('glass-repro-term-size', JSON.stringify({
            width: termWindow.style.width,
            height: termWindow.style.height
          }));
        } catch(e) {}
        // Resize terminals after window resize
        setTimeout(resizeAll, 50);
      }
    });

    // Restore saved size
    try {
      var saved = JSON.parse(localStorage.getItem('glass-repro-term-size'));
      if (saved && saved.width && saved.height) {
        termWindow.style.width = saved.width;
        termWindow.style.height = saved.height;
      }
    } catch(e) {}
  })();

  // ===== MAXIMIZE (same as template-glass toolbar.js:1164-1191) =====
  (function() {
    var termMaxBtn = document.getElementById('term-maximize');
    var termMaxIcon = document.getElementById('term-maximize-icon');
    var expandSVG = '<polyline points="9,1 13,1 13,5"/><line x1="13" y1="1" x2="8" y2="6"/><polyline points="5,13 1,13 1,9"/><line x1="1" y1="13" x2="6" y2="8"/>';
    var collapseSVG = '<polyline points="5,1 1,1 1,5"/><line x1="1" y1="1" x2="6" y2="6"/><polyline points="9,13 13,13 13,9"/><line x1="13" y1="13" x2="8" y2="8"/>';

    termMaxBtn.addEventListener('click', function() {
      if (termWindow.classList.contains('maximized')) {
        termWindow.classList.remove('maximized');
        termMaxIcon.innerHTML = expandSVG;
        termMaxBtn.title = 'Maximize';
      } else {
        termWindow.classList.add('maximized');
        termMaxIcon.innerHTML = collapseSVG;
        termMaxBtn.title = 'Restore';
      }
      setTimeout(resizeAll, 50);
    });
  })();

  // ===== TERMINAL MANAGEMENT =====
  var terminals = {};
  var activeTerminalId = 1;

  function createTerminal(identCode, name) {
    log('createTerminal(' + identCode + ', "' + name + '")');

    var container = document.createElement('div');
    container.id = 'terminal-container-' + identCode;
    container.className = 'terminal-container' + (identCode === 1 ? ' active' : '');

    if (SHOW_OVERLAY) {
      var ol = document.createElement('div');
      ol.className = 'loading-overlay';
      ol.id = 'loading-overlay-' + identCode;
      ol.textContent = 'Waiting for boot...';
      container.appendChild(ol);
    }

    termWindowBody.appendChild(container);

    var tab = document.createElement('div');
    tab.className = 'terminal-tab' + (identCode === 1 ? ' active' : '');
    tab.dataset.terminal = identCode;
    tab.textContent = name;
    tabsEl.appendChild(tab);

    tab.addEventListener('click', function() {
      switchTerminal(identCode);
    });

    var term = new RetroTerm.Terminal({
      rows: 24,
      cols: 80,
      theme: {
        background: '#0a0e1c',
        foreground: '#b0ffb0',
        cursor: '#00ff88',
      },
      emulatorType: 'tdv2200'
    });

    var fitAddon = new RetroTerm.FitAddon();
    term.loadAddon(fitAddon);
    term.open(container);

    log('term.open() into container (display:' +
        (container.classList.contains('active') ? 'flex' : 'none') + ')');

    function resizeFn() {
      term.resize(80, 24);
      term.refresh(0, term.rows - 1);
    }

    terminals[identCode] = {
      term: term,
      container: container,
      resize: resizeFn
    };

    // Same as template-glass: setTimeout(resizeTerminal, 0)
    setTimeout(resizeFn, 0);

    // ResizeObserver on the terminal-window (same as template-glass)
    var observer = new ResizeObserver(function() { resizeFn(); });
    observer.observe(termWindow);

    return term;
  }

  function switchTerminal(identCode) {
    log('switchTerminal(' + identCode + ')');

    document.querySelectorAll('.terminal-tab').forEach(function(tab) {
      tab.classList.toggle('active', parseInt(tab.dataset.terminal) === identCode);
    });

    Object.keys(terminals).forEach(function(id) {
      var cont = terminals[parseInt(id)].container;
      cont.classList.toggle('active', parseInt(id) === identCode);
    });

    activeTerminalId = identCode;

    if (terminals[identCode]) {
      terminals[identCode].term.focus();
      setTimeout(function() { terminals[identCode].resize(); }, 0);
    }
  }

  function resizeAll() {
    Object.keys(terminals).forEach(function(id) {
      if (terminals[parseInt(id)].container.classList.contains('active')) {
        terminals[parseInt(id)].resize();
      }
    });
    log('resize triggered');
  }

  // ===== INIT SEQUENCE =====

  function initializeTerminals() {
    log('initializeTerminals()');

    var term1 = createTerminal(1, 'Console');
    wireKeyboard(term1);

    if (TWO_TABS) {
      var term2 = createTerminal(2, 'Terminal 2');
      wireKeyboard(term2);
    }

    switchTerminal(1);

    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        resizeAll();
        statusEl.textContent = 'ready';
        statusEl.className = 'status';
      });
    });

    setTimeout(function() {
      Object.keys(terminals).forEach(function(id) {
        var ol = document.getElementById('loading-overlay-' + id);
        if (ol) {
          ol.classList.add('hidden');
          setTimeout(function() { ol.style.display = 'none'; }, 300);
        }
      });
      sintranBanner();
      log('boot complete');
    }, SHOW_OVERLAY ? 800 : 300);
  }

  if (FONT_DELAY) {
    log('waiting for document.fonts.ready...');
    document.fonts.ready.then(function() {
      log('fonts ready');
      initializeTerminals();
    });
  } else {
    initializeTerminals();
  }

  // ===== HOST WRITE =====

  function hostWrite(text) {
    var t = terminals[activeTerminalId];
    if (!t) return;

    if (CHAR_BY_CHAR) {
      for (var i = 0; i < text.length; i++) {
        t.term.write(String.fromCharCode(text.charCodeAt(i)));
      }
    } else {
      t.term.write(text);
    }
  }

  // ===== KEYBOARD ECHO =====
  var inputBuffer = '';

  function wireKeyboard(term) {
    term.onKey(function(ev) {
      var str = ev.key;
      for (var i = 0; i < str.length; i++) {
        var ch = str.charCodeAt(i);
        if (ch === 13 || ch === 10) {
          hostWrite('\r\n');
          if (inputBuffer.length > 0) {
            hostWrite('  (' + inputBuffer + ')\r\n');
          }
          inputBuffer = '';
          hostWrite('@');
        } else if (ch === 127 || ch === 8) {
          if (inputBuffer.length > 0) {
            inputBuffer = inputBuffer.slice(0, -1);
            hostWrite('\b \b');
          }
        } else if (ch >= 32) {
          inputBuffer += str[i];
          hostWrite(str[i]);
        }
      }
    });
  }

  // ===== SIMULATED HOST OUTPUT =====
  var lineNum = 0;

  function sintranBanner() {
    hostWrite('\r\n');
    hostWrite('  ND-100/CX   SINTRAN III - VS  J0101\r\n');
    hostWrite('  SYSTEM  846602  ND-100/CX\r\n');
    hostWrite('  CENTRAL MEMORY:  4096 KB\r\n');
    hostWrite('\r\n');
    hostWrite('@');
  }

  function feedOneLine() {
    lineNum++;
    var text = 'LINE ' + String(lineNum).padStart(4, '0') +
      '  ABCDEFGHIJKLMNOPQRSTUVWXYZ  0123456789  ' +
      String.fromCharCode(65 + (lineNum % 26)).repeat(20);
    hostWrite(text.substring(0, 78) + '\r\n');
  }

  // ===== CONTROLS =====

  var hostInput = document.getElementById('host-input');
  document.getElementById('btn-send-text').addEventListener('click', function() {
    if (hostInput.value) {
      hostWrite(hostInput.value);
      log('sent: "' + hostInput.value + '"');
      hostInput.value = '';
    }
    hostInput.focus();
  });
  hostInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('btn-send-text').click();
  });

  document.getElementById('btn-send-cr').addEventListener('click', function() {
    hostWrite('\r\n@');
  });

  document.getElementById('btn-send-lines').addEventListener('click', function() {
    for (var i = 0; i < 10; i++) feedOneLine();
    log('sent 10 lines');
  });

  document.getElementById('btn-send-banner').addEventListener('click', function() {
    sintranBanner();
  });

  var zoomSlider = document.getElementById('zoom-slider');
  var zoomVal = document.getElementById('zoom-val');
  zoomSlider.addEventListener('input', function() {
    var z = parseFloat(this.value);
    zoomVal.textContent = z.toFixed(2);
    applyZoom(z);
  });

  var feedTimer = null;

  function startFeed(intervalMs) {
    stopFeed();
    feedTimer = setInterval(feedOneLine, intervalMs);
    log('feeding at ' + intervalMs + 'ms');
  }

  function stopFeed() {
    if (feedTimer) {
      clearInterval(feedTimer);
      feedTimer = null;
      log('feed stopped');
    }
  }

  document.getElementById('btn-feed-slow').addEventListener('click', function() {
    sintranBanner(); startFeed(200);
  });
  document.getElementById('btn-feed-fast').addEventListener('click', function() {
    sintranBanner(); startFeed(16);
  });
  document.getElementById('btn-feed-scroll').addEventListener('click', function() {
    sintranBanner(); stopFeed();
    var count = 0;
    feedTimer = setInterval(function() {
      for (var i = 0; i < 5; i++) feedOneLine();
      count += 5;
      if (count > 500) stopFeed();
    }, 16);
    log('scroll storm (500 lines)');
  });
  document.getElementById('btn-stop').addEventListener('click', stopFeed);

  document.getElementById('btn-resize').addEventListener('click', function() {
    resizeAll();
  });
  document.getElementById('btn-clear').addEventListener('click', function() {
    hostWrite('\x1b[2J\x1b[H');
    lineNum = 0;
    inputBuffer = '';
    log('screen cleared');
  });

  // ===== BEHAVIOR TOGGLES =====
  function setParam(key, val) {
    var u = new URL(location.href);
    u.searchParams.set(key, val);
    location.href = u.toString();
  }

  document.getElementById('tog-charbychar').addEventListener('click', function() {
    setParam('charbychar', CHAR_BY_CHAR ? '0' : '1');
  });
  document.getElementById('tog-fontdelay').addEventListener('click', function() {
    setParam('fontdelay', FONT_DELAY ? '0' : '1');
  });
  document.getElementById('tog-overlay').addEventListener('click', function() {
    setParam('overlay', SHOW_OVERLAY ? '0' : '1');
  });
  document.getElementById('tog-twotabs').addEventListener('click', function() {
    setParam('twotabs', TWO_TABS ? '0' : '1');
  });

  // ===== CSS TOGGLES =====
  function toggle(btnId, applyFn) {
    var btn = document.getElementById(btnId);
    btn.addEventListener('click', function() {
      var active = btn.classList.toggle('active');
      applyFn(active);
      log(btnId + ': ' + (active ? 'ON' : 'OFF'));
    });
  }

  toggle('tog-zoom', function(on) {
    if (on) {
      applyZoom(parseFloat(zoomSlider.value));
      termWindow.style.zoom = '';
    } else {
      document.documentElement.style.zoom = '1';
      document.documentElement.style.setProperty('--ui-zoom', '1');
      termWindow.style.zoom = '1';
    }
  });

  toggle('tog-backdrop', function(on) {
    var existing = termWindow.querySelector('style[data-backdrop]');
    if (on) {
      if (existing) existing.remove();
    } else {
      var s = document.createElement('style');
      s.dataset.backdrop = '1';
      s.textContent = '.terminal-window::before { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }';
      termWindow.appendChild(s);
    }
  });

  toggle('tog-willchange', function(on) {
    Object.keys(terminals).forEach(function(id) {
      var canvas = terminals[parseInt(id)].container.querySelector('canvas');
      if (canvas) canvas.style.willChange = on ? 'transform' : 'auto';
    });
  });

})();
</script>
</body>
</html>
